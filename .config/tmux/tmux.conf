# set -g @minimal_theme_active_color "#83a598"
# set -g @minimal_theme_inactive_color "#665c54"
# set -g @minimal_theme_text_color "#ebdbb2"
# set -g @minimal_theme_accent_color "#83a598"
# set -g @minimal_theme_border_color "#504945"

# -- Initialize Custom Minimal Theme ---------------------------------------------
# Load and apply our custom minimal theme with macOS support and proper emojis
run-shell 'source ~/.config/tmux/scripts/custom-minimal-theme.sh && apply_custom_minimal_theme'

# -- Plugin Management (TPM) -----------------------------------------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# -- Worktree Session Switcher (Search → List | Preview) -----------------------
set -g @worktree-switcher-window-height '85%'
set -g @worktree-switcher-window-width '85%'
set -g @worktree-switcher-layout 'reverse'
set -g @worktree-switcher-preview-location 'right'
set -g @worktree-switcher-preview-ratio '50%'
set -g @worktree-switcher-prompt ' '
set -g @worktree-switcher-pointer '▶'
set -g @worktree-switcher-additional-options "\
--color=bg+:#1c1c1c,bg:#141415 \
--color=border:#6c7086,header:#a6adc8 \
--color=gutter:#141415,hl:#9399b2 \
--color=hl+:#cdd6f4,info:#7f849c \
--color=marker:#9399b2,pointer:#bac2de \
--color=prompt:#a6adc8,spinner:#9399b2 \
--color=fg:#a6adc8,fg+:#cdd6f4 \
--border=sharp \
--info=inline \
--no-scrollbar \
--cycle"
unbind-key w
bind-key w run-shell "$HOME/.config/tmux/scripts/tmux-session-switcher"

run '~/.config/tmux/plugins/tpm/tpm'
