# Personal Tmux Configuration
# Clean, minimal tmux setup with a custom theme

# -- Prefix and Basic Settings ----------------------------------------------------
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# -- Core Settings ---------------------------------------------------------------
set-option -g mouse on
set -g base-index 1                    # start windows numbering at 1
setw -g pane-base-index 1              # make pane numbering consistent with windows
setw -g automatic-rename on            # rename window to reflect current program
set -g renumber-windows on             # renumber windows when a window is closed
set -g set-titles on                   # set terminal title
set -g display-panes-time 800          # slightly longer pane indicators display time
set -g display-time 1000               # slightly longer status messages display time
set -g status-interval 10              # redraw status line every 10 seconds
set -g history-limit 50000             # boost history
set -g detach-on-destroy off           # don't exit from tmux when closing a session
set -g set-clipboard on                # use system clipboard
set -g status-position bottom          # status bar at bottom
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# -- Terminal and Color Support --------------------------------------------------
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -as terminal-features ',*:hyperlinks'

# -- Transparency Support --------------------------------------------------------
set-option -sa terminal-overrides ',*:Tc'  # true color support
set -g window-style 'bg=default'           # transparent window background
set -g window-active-style 'bg=default'    # transparent active window background

# -- Keybindings ------------------------------------------------------------------

# Session management
bind-key K kill-session               # Kill session
bind C-c new-session                  # Create new session
bind c new-window                     # Create new window

# Pane navigation (vim-like)
bind h select-pane -L              # move left
bind j select-pane -D              # move down
bind k select-pane -U              # move up
bind l select-pane -R              # move right

# Pane splitting
unbind %
bind | split-window -h                # Split horizontally
unbind '"'
bind - split-window -v                # Split vertically

# Pane resizing
bind -r , resize-pane -L 15     # Resize left (comma)
bind -r . resize-pane -R 15     # Resize right (period)
bind -r < resize-pane -U 15     # Resize up
bind -r > resize-pane -D 15    # Resize down

# Pane switcher from left to right
bind -r H swap-pane -U
bind -r L swap-pane -D

# Window management
bind R command-prompt "rename-window %%"  # Rename window
bind x kill-pane                      # Kill pane
bind f resize-pane -Z                 # Toggle pane zoom

# Config management
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Cursor (reuse window) — Prefix + u
bind-key u run-shell "tmux-open-cursor"

# VS Code (reuse window) — Prefix + v
bind-key v run-shell "tmux-open-vscode"

# Session and Workmux picker — Prefix + Tab
bind-key Tab new-window -c '#{pane_current_path}' "$HOME/.config/tmux/scripts/tmux-sessionizer"
bind-key M-h new-window "$HOME/.config/tmux/scripts/tmux-sessionizer -s 0"
bind-key M-t new-window "$HOME/.config/tmux/scripts/tmux-sessionizer -s 1"

# Workmux dashboard — Prefix + g (popup, same UX as the session switcher)
unbind-key W
bind-key g display-popup -B -d '#{pane_current_path}' -w 100% -h 100% -E 'workmux dashboard --tab worktrees'

# Open command history with fzf
bind ` display-popup -E "zsh -ic 'fc -R; eval \"$(fc -ln 1 | fzf --tac)\"'"

# Lazygit popup
bind t switch-client -T lazygit-table
bind -T lazygit-table g display-popup -B -d '#{pane_current_path}' -w 100% -h 100% -E 'lazygit'

# -- Copy Mode (Vi-style) ---------------------------------------------------------
setw -g mode-keys vi

# Copy mode bindings
bind V copy-mode -u                   # Enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi c if -F '#{selection_present}' 'send -X clear-selection' 'send -X begin-selection'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Copy mode navigation
bind -T copy-mode-vi h send -N1 -X cursor-left
bind -T copy-mode-vi l send -N1 -X cursor-right
bind -T copy-mode-vi j send -N1 -X cursor-down
bind -T copy-mode-vi k send -N1 -X cursor-up

# Mouse wheel scrolling
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# -- Minimal Theme Configuration --------------------------------------------------
# Colors live in variants/; `theme` is a symlink flipped by ~/.local/scripts/theme
source-file ~/.config/tmux/theme

# -- Initialize Custom Minimal Theme ---------------------------------------------
# Load and apply our custom minimal theme with macOS support and proper emojis
run-shell 'source ~/.config/tmux/scripts/custom-minimal-theme.sh && apply_custom_minimal_theme'

# -- Worktree Session Switcher (Search → List | Preview) -----------------------
set -g @worktree-switcher-window-height '85%'
set -g @worktree-switcher-window-width '85%'
set -g @worktree-switcher-layout 'reverse'
set -g @worktree-switcher-preview-location 'right'
set -g @worktree-switcher-preview-ratio '50%'
set -g @worktree-switcher-prompt ' '
set -g @worktree-switcher-pointer '▶'
unbind-key w
bind-key w run-shell "$HOME/.config/tmux/scripts/tmux-session-switcher"
